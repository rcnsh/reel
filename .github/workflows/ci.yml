# Typecheck and the test suite on Linux, on every push to main and every pull request.
# The job runs in Debian 13 (trixie), the image of the box the Linux goldens (tests/golden/linux/) are rendered on,
# so Chrome finds the same fonts and libraries. Runners have no GPU: WebGL goes through SwiftShader, as on the box.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# (a newer push to a pull request cancels its older run; every commit on main keeps its own)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      # (an init reaps the warm renderers the tests stop: without one they linger as zombies that still look alive)
      options: --init
    timeout-minutes: 45
    env:
      REEL_CHROME_CACHE: /github/home/.cache/reel-chrome
    steps:
      - name: System packages (ffmpeg, Chrome's libraries, the box's fonts)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl unzip git zstd procps ffmpeg \
            fontconfig fonts-dejavu-core fonts-dejavu-mono fonts-noto-cjk fonts-urw-base35 \
            libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 libdbus-1-3
          # (the encoders tests/video-formats.test.ts needs)
          for e in libx264 libx265 libopus libvpx-vp9 prores_ks; do ffmpeg -hide_banner -encoders | grep -qw "$e" || { echo "ffmpeg lacks $e"; exit 1; }; done

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Cache Chrome for Testing
        uses: actions/cache@v6
        with:
          path: ${{ env.REEL_CHROME_CACHE }}
          key: reel-chrome-${{ runner.os }}-${{ hashFiles('cli/chrome.ts') }}

      - run: bun cli/reel.ts chrome install

      - run: bun run typecheck

      - run: bun test
        env:
          REEL_EXPORTS_DIR: /tmp/reel-exports
          REEL_GOLDEN_ACTUAL: /tmp/golden-actual

      - name: Upload the rendered golden frames
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-actual-linux
          path: /tmp/golden-actual
          if-no-files-found: ignore
